# 本地开发环境依赖服务,见 docs/02-architecture/ARCHITECTURE.md 第 7 节"部署架构"。
# 使用方式:docker compose up -d,随后按 apps/api/.env.example 配置 DATABASE_URL / REDIS_URL。
name: gearblindbox

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gearblindbox
      POSTGRES_PASSWORD: gearblindbox
      POSTGRES_DB: gearblindbox
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gearblindbox']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
